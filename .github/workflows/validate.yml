name: Validate signed SDK integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      HORIZON_LAUNCHER_HOME: ${{ github.workspace }}/target/sdk-launcher
      HORIZON_HOME: ${{ github.workspace }}/target/sdk-game
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Read SDK pin
        id: pins
        run: |
          python3 - <<'PY'
          import json, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('horizon=' + json.load(open('compatibility.json'))['horizon_revision'], file=output)
          PY
      - uses: actions/checkout@v4
        with:
          repository: horizon-rust/horizon
          ref: ${{ steps.pins.outputs.horizon }}
          path: target/ci/horizon
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/ci/tools
            target/sdk-launcher
            target/sdk-api-tests
          key: sdk-linux-${{ runner.arch }}-${{ steps.pins.outputs.horizon }}-v1
      - name: Build the pinned package tool
        run: cargo build --locked --release --manifest-path target/ci/horizon/Cargo.toml -p cargo-horizon-mod --target-dir target/ci/tools
      - name: Prepare the pinned launcher and installed Nightly
        run: |
          mkdir -p target/ci/launcher target/ci/nightly-index
          gh release download 'launcher@0.2.78' --repo horizon-rust/horizon --pattern horizon-launcher-linux-x86_64.AppImage --dir target/ci/launcher --clobber
          chmod +x target/ci/launcher/horizon-launcher-linux-x86_64.AppImage
          cd target/ci/launcher
          ./horizon-launcher-linux-x86_64.AppImage --appimage-extract > extract.log
          cd ../../..
          nightly_tag=nightly-2026-11-18
          if gh release download nightly --repo horizon-rust/horizon --pattern sdk.json --dir target/ci/nightly-index --clobber; then
            if python3 -c 'import json; assert json.load(open("target/ci/nightly-index/sdk.json"))["build"]["commit"] == json.load(open("compatibility.json"))["horizon_revision"]'; then
              nightly_tag=nightly
            fi
          fi
          target/ci/launcher/squashfs-root/usr/bin/horizon-launcher install "$nightly_tag"
      - name: Check runtime and package
        run: |
          cargo fetch --locked
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
          cargo test --workspace --locked --offline
          python3 tools/test_template.py
      - name: Compile the installable hmod and audit its AST changes
        run: |
          python3 tools/horizon.py check --horizon target/ci/horizon
          python3 tools/test_stage.py --horizon target/ci/horizon
          python3 tools/horizon.py test --horizon target/ci/horizon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-validation
          path: |
            target/*.hmod
            target/sdk-*.log
            target/sdk-build.json
